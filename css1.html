<!DOCTYPE html>
<html>
<head>
<title>Untitled Document</title>
<style>
#box{
width:100px;
height:100px;
font-size:18px;
background-color:#0CF;
border-radius:5px;
box-shadow:10px 10px 2px #999999;
text-align:center;
padding-top:20px;
text-shadow: 2px 2px 2px #666666;
}
#box:hover{
transform:scale(2,1.5);
-webkit-transform:scale(2,1.5);
-ms-transform:scale(2,1.5);
}
</style>
</head>
<body>
<div id="box">
Mouse over me
</div>
</body>
</html>
